<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サッカー審判道場</title>
<meta name="description" content="中継でよく見る37の場面を、あなたが審判になって判定するゲーム。サッカー観戦をはじめた人のための、2026/27競技規則対応のルール学習アプリ。">
<meta name="theme-color" content="#2F8A4C">
<meta property="og:type" content="website">
<meta property="og:title" content="サッカー審判道場">
<meta property="og:description" content="審判の目で、試合を見よう。中継でよく見る37の場面を判定して、ルールが自然と身につく。">
<meta property="og:url" content="https://shinpan-dojo.pages.dev/">
<meta property="og:image" content="https://shinpan-dojo.pages.dev/icons/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="審判道場">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <!-- HOME -->
  <section id="v-home" class="view">
    <header class="mast">
      <p class="eyebrow">サッカー観戦をはじめたあなたへ</p>
      <h1><span class="y">審判</span>の目で、<br>試合を見よう。</h1>
      <p class="sub">中継でよく見る<span id="totalQ">37</span>の場面を、あなたが判定するゲーム。</p>
    </header>
    <div class="license" id="license"></div>
    <ol class="fx-grid" id="fixtures"></ol>
    <button class="btn-y push" id="cta" data-act="intro" data-v="0">第1節からはじめる</button>
    <div class="home-bottom">
      <button class="book-row" data-act="book" id="bookRow"></button>
      <button class="toggle" data-act="sound" id="soundBtn">笛の音<br>オフ</button>
    </div>
    <p class="foot">2026/27 サッカー競技規則（IFAB・JFA）に基づく内容です。</p>
  </section>

  <!-- INTRO -->
  <section id="v-intro" class="view" hidden>
    <button class="back" data-act="home">← 日程に戻る</button>
    <div class="intro-head">
      <p class="eyebrow" id="inNo"></p>
      <h2 id="inTitle"></h2>
      <p class="lead" id="inLead"></p>
    </div>
    <div class="points"><h3>この節のポイント</h3><ul id="inPoints"></ul></div>
    <p class="meta" id="inMeta"></p>
    <button class="btn-y push" data-act="start">キックオフ</button>
  </section>

  <!-- PLAY -->
  <section id="v-play" class="view" hidden>
    <div class="playbar">
      <button class="icon-btn" data-act="home" aria-label="中断して日程に戻る">✕</button>
      <div class="pb-title"><small id="pbNo"></small><b id="pbTitle"></b></div>
      <div class="ledmini" aria-label="正解とミスの数"><span class="g" id="ledOk">0</span><span class="s">|</span><span class="r" id="ledNg">0</span></div>
    </div>
    <div class="pips" id="pips"></div>
    <div class="scene" id="scene"></div>
    <div class="qpanel" id="qpanel">
      <p class="prompt" id="prompt"></p>
      <div class="choices" id="choices"></div>
    </div>
    <div class="fb" id="fb" hidden aria-live="polite"></div>
  </section>

  <!-- RESULT -->
  <section id="v-result" class="view" hidden>
    <div class="res-top">
      <p class="whistle-txt">ピッ、ピッ、ピーーッ</p>
      <h2>試合終了</h2>
      <p class="meta" id="resCh"></p>
    </div>
    <div class="board" id="board"></div>
    <div class="res-stars" id="resStars"></div>
    <div id="promo" hidden class="promo"></div>
    <ul class="review" id="review"></ul>
    <div class="btn-row push">
      <button class="btn-ghost" data-act="retry">もう一度</button>
      <button class="btn-ghost" data-act="home">日程へ</button>
    </div>
    <button class="btn-y" id="nextCh" data-act="nextch">次の節へ</button>
  </section>

  <!-- NOTEBOOK -->
  <section id="v-book" class="view" hidden>
    <button class="back" data-act="home">← 日程に戻る</button>
    <div class="book-head">
      <p class="eyebrow">REFEREE NOTEBOOK</p>
      <h2>審判手帳</h2>
      <p>判定した場面のルールが記録されます。観戦中の「今のなに？」に。</p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="book-ch" id="bookList" role="tabpanel"></div>
  </section>
</main>
<script src="js/questions.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
